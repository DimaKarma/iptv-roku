name: Generate EPG

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (UTC); Actions may delay it by a few minutes
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: epg
  cancel-in-progress: false

# Two jobs, so that the step which parses a 46 MB feed fetched over plain HTTP from a
# third party never runs in the same job as the credential that can write to this
# repository. `generate` has read-only permissions and no push token; it hands ONE file to
# `publish` through an artifact, and `publish` re-validates that file before it is hashed.
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # No push token is stored in .git/config. (This job has none to store, but the
          # setting is kept so that a later permissions change cannot quietly hand the
          # feed parser a credential.)
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        # --require-hashes makes the pins in requirements.txt load-bearing: without it a
        # pinned version is still fetched from whatever PyPI serves under that name.
        run: pip install --require-hashes -r epg/requirements.txt
      - name: Generate epg.json
        working-directory: epg
        run: python generate_epg.py
      - name: Check the guide and its size
        id: digest
        run: |
          # The artefact must be a plausible guide before it is handed on. A zero-byte
          # epg/epg.json otherwise passes through the whole pipeline and publishes cleanly.
          python -c "
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          n = len(d.get('epg', {}))
          assert n and n == d.get('count'), 'degenerate guide: count=%r epg=%d' % (d.get('count'), n)
          print('guide ok: %d channels' % n)
          " epg/epg.json

          # A guide this large means a bound in the generator stopped working (the real
          # file is under 1 MB). Refuse it here so the run goes red instead of publishing.
          size=$(wc -c < epg/epg.json)
          echo "epg.json size: $size bytes"
          [ "$size" -le 3000000 ] || { echo "epg.json is $size bytes, over the 3000000 byte limit; refusing to publish"; exit 1; }

          # The publish job recomputes this over the downloaded file: a different digest
          # means the artefact was altered between the two jobs.
          echo "sha256=$(sha256sum epg/epg.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: epg-json
          path: epg/epg.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: epg-json
          path: artifact
      - name: Publish epg.json to the epg-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: ${{ needs.generate.outputs.sha256 }}
        run: |
          # No checkout in this job, so there is no repository yet: the plumbing below
          # (hash-object -w, mktree, commit-tree) only needs an object database.
          git init -q
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"

          # Publish ONE rootless commit and force-push it, so the branch never holds more
          # than the current guide. Built with plumbing: no checkout, no worktree, and --
          # the reason this was rewritten -- no `git fetch origin epg-data`.
          #
          # actions/checkout uses fetch-depth 1, but a later `git fetch <remote> <branch>`
          # is NOT depth-limited, so that one line pulled the branch's entire history on
          # every run. Measured against this remote: 286.57 KiB for the checkout, 89.45 MiB
          # after the fetch, 464 commits, 21 seconds -- roughly 780 MiB a day to publish a
          # 923 KB file, and growing.
          #
          # There is no "skip when unchanged" branch because there is nothing to skip:
          # generate_epg.py stamps {"generated": int(time.time())} into every file, so the
          # blob differs every run by construction. "No EPG changes." never printed once in
          # 463 runs. Runs are serialised by the `concurrency` group above, so two
          # force-pushes cannot race.

          # Re-validate what was DOWNLOADED, not what the previous job says it uploaded.
          [ "$(sha256sum artifact/epg.json | cut -d' ' -f1)" = "$EXPECTED_SHA256" ] || { echo "artifact digest differs from the one generate computed"; exit 1; }
          size=$(wc -c < artifact/epg.json)
          [ "$size" -le 3000000 ] || { echo "artifact is $size bytes, over the 3000000 byte limit; refusing to publish"; exit 1; }
          python -c "
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          n = len(d.get('epg', {}))
          assert n and n == d.get('count'), 'degenerate guide: count=%r epg=%d' % (d.get('count'), n)
          print('guide ok: %d channels' % n)
          " artifact/epg.json

          # The artefact is downloaded to artifact/epg.json, and `git mktree` rejects a path containing
          # a slash, so the TREE ENTRY is named epg.json while the SOURCE stays artifact/epg.json.
          # --no-filters: .gitattributes at the root of main sets `* text=auto eol=lf` and
          # applies to paths under epg/ too, while the old `git add` ran on the epg-data
          # branch, which carries no .gitattributes. Measured: this only changes the hash
          # for CRLF input -- a multi-line LF file hashes identically either way -- so it
          # guards a Windows-authored file reaching the generator, not indentation.
          blob=$(git hash-object -w --no-filters artifact/epg.json)
          tree=$(printf '100644 blob %s\tepg.json\n' "$blob" | git mktree)

          # A slashed path fails loudly; a TYPO does not. `epg.jsn` builds a tree at exit 0,
          # commits, force-pushes, and leaves a GREEN run serving 404 to the television --
          # with no previous commit on the branch to fall back to. Hence this assertion.
          entry=$(git ls-tree --name-only "$tree")
          [ "$entry" = "epg.json" ] || { echo "tree entry is '$entry', expected 'epg.json'"; exit 1; }

          # Anonymous and read-only: the repo is public, so the credential still appears in
          # exactly one place, the push below.
          PUBLIC="https://github.com/${GITHUB_REPOSITORY}.git"
          prev=$(git ls-remote "$PUBLIC" refs/heads/epg-data | cut -f1)
          commit=$(git commit-tree "$tree" -m "EPG $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          # The branch keeps one commit, so there is no parent to roll back to -- but a
          # force-pushed commit stays reachable by sha on GitHub for a long time (a414668,
          # pushed off main in July, still serves today). Logging the previous tip is the
          # whole rollback story: git push --force <url> <prev>:refs/heads/epg-data
          echo "previous tip: ${prev:-none}  publishing: $commit  blob: $blob"

          # The credential is supplied here and nowhere else. Passing it in the URL rather
          # than via `git remote set-url` keeps it out of .git/config; Actions masks the
          # secret in the log either way.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$commit:refs/heads/epg-data"

          # A rejected push must not leave a green run.
          landed=$(git ls-remote "$PUBLIC" refs/heads/epg-data | cut -f1)
          [ "$landed" = "$commit" ] || { echo "push did not land: remote is '$landed'"; exit 1; }
