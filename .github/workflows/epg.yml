name: Generate EPG

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (UTC); Actions may delay it by a few minutes
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # Do not leave the push token in .git/config for the whole job. By default
          # checkout stores GITHUB_TOKEN as an HTTP extraheader, so every later step --
          # including `pip install` and the generator, which parse a 46 MB feed fetched
          # over plain HTTP from a third party -- runs with a credential that can write to
          # this repository. The publish step below is handed the token explicitly instead.
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        # --require-hashes makes the pins in requirements.txt load-bearing: without it a
        # pinned version is still fetched from whatever PyPI serves under that name.
        run: pip install --require-hashes -r epg/requirements.txt
      - name: Generate epg.json
        working-directory: epg
        run: python generate_epg.py
      - name: Publish epg.json to the epg-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          cp epg/epg.json "$RUNNER_TEMP/epg.json"
          git fetch origin epg-data
          # Work on epg-data in a throwaway worktree so main is never touched.
          git worktree add -B epg-data "$RUNNER_TEMP/wt" origin/epg-data
          cp "$RUNNER_TEMP/epg.json" "$RUNNER_TEMP/wt/epg.json"
          cd "$RUNNER_TEMP/wt"
          git add epg.json
          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "Update EPG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The credential is supplied here and nowhere else. Passing it in the URL
            # rather than via `git remote set-url` keeps it out of .git/config; Actions
            # masks the secret in the log either way.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" epg-data
          fi
